name: Explicit App Store Submission
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [inspect, prepare, submit]
        default: inspect
      build_number:
        type: string
        default: ''
jobs:
  app-store:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Explicit existing-app release operation
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          STORE_OPERATION: ${{ inputs.operation }}
          STORE_BUILD_NUMBER: ${{ inputs.build_number }}
        run: python3 scripts/prepare-app-store.py

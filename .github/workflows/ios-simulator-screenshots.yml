name: iOS Simulator Screenshots

# Default operation captures unsigned simulator QA. Explicit metadata/beta jobs never publish an App Store release.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Choose native QA or an explicit existing-app metadata operation'
        type: choice
        options:
          - capture
          - inspect-apple
          - configure-apple-products
          - upload-iap-screenshots
          - prepare-testflight
        default: capture
      test_scope:
        description: 'Run the full native suite or only the three commerce regressions'
        type: choice
        options: [full, commerce]
        default: full
      screenshots_run_id:
        description: 'Exact iPhone capture run containing the reviewed images'
        type: string
        default: ''
      review_voice_sha256:
        description: 'SHA256 of the visually reviewed voice capture'
        type: string
        default: ''
      review_palette_sha256:
        description: 'SHA256 of the visually reviewed palette capture'
        type: string
        default: ''
      submit_testflight_review:
        description: 'Submit the selected test build for Apple beta review only'
        type: boolean
        default: false
      enable_testflight_distribution:
        description: 'Enable the beta link after validation and Apple eligibility'
        type: boolean
        default: false
      testflight_build_number:
        description: 'Exact uploaded 1.0.1 build number'
        type: string
        default: ''
  push:
    branches: [fix/ios-review-purchase-gates]
    paths:
      - .github/workflows/ios-simulator-screenshots.yml
      - scripts/prepare-screenshot-tests.rb
      - tests/ios/**
      - gameplay-input-fairness.js
      - package.json

concurrency:
  group: ios-native-${{ github.ref }}-${{ inputs.operation || 'capture' }}-${{ inputs.test_scope || 'full' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  upload-iap-screenshots:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'upload-iap-screenshots'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ios-simulator-iphone
          run-id: ${{ inputs.screenshots_run_id }}
          github-token: ${{ github.token }}
          path: work/review-captures
      - name: Upload exact visually reviewed images to existing Apple products
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          REVIEW_VOICE_SHA256: ${{ inputs.review_voice_sha256 }}
          REVIEW_PALETTE_SHA256: ${{ inputs.review_palette_sha256 }}
        run: python3 scripts/upload-apple-review-screenshots.py
  prepare-testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'prepare-testflight'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare only the selected test build
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          TESTFLIGHT_BUILD_NUMBER: ${{ inputs.testflight_build_number }}
          TESTFLIGHT_SUBMIT_REVIEW: ${{ inputs.submit_testflight_review }}
          TESTFLIGHT_ENABLE_DISTRIBUTION: ${{ inputs.enable_testflight_distribution }}
        run: python3 scripts/prepare-testflight.py
  configure-apple-products:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'configure-apple-products'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the six authorized Apple products
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: python3 scripts/configure-apple-products.py
  inspect-apple:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'inspect-apple'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read existing Apple app and product metadata
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: python3 scripts/inspect-apple-products.py
  capture:
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'capture'
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: iphone
            device_type: com.apple.CoreSimulator.SimDeviceType.iPhone-14-Plus
          - label: ipad
            device_type: com.apple.CoreSimulator.SimDeviceType.iPad-Pro-13-inch-M4-8GB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gameplay and review regression tests
        run: npm ci --prefix tests && npm test --prefix tests
      - name: Prepare real Capacitor iOS app
        run: npm install && npm run ios:prepare
      - name: Add simulator UI capture target
        run: |
          gem install xcodeproj --no-document
          ruby scripts/prepare-screenshot-tests.rb
      - name: Create simulator
        env:
          DEVICE_TYPE: ${{ matrix.device_type }}
        run: |
          xcrun simctl list devices available
          xcrun simctl list devicetypes
          # Apple's FB22237318 affects CLI StoreKit sessions on iOS 26.5.
          RUNTIME=$(xcrun simctl list runtimes -j | python3 scripts/select-storekit-runtime.py)
          DEVICE_ID=$(xcrun simctl create ReviewCapture "$DEVICE_TYPE" "$RUNTIME")
          echo "CAPTURE_DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
      - name: Capture genuine app screens through XCTest
        env:
          NATIVE_TEST_SCOPE: ${{ inputs.test_scope || 'full' }}
        run: |
          native_test_args=()
          if [ "$NATIVE_TEST_SCOPE" = commerce ]; then
            native_test_args+=(
              '-only-testing:ScreenshotCapture/ScreenshotCapture/testAppleIndividualPalettePurchases'
              '-only-testing:ScreenshotCapture/ScreenshotCapture/testAppleRagePassUnlocksAllPalettes'
              '-only-testing:ScreenshotCapture/ScreenshotCapture/testAppleVoicePurchasesAndRestore'
            )
          fi
          xcodebuild test "${native_test_args[@]}" \
            -workspace ios/App/App.xcworkspace \
            -scheme ScreenshotCapture \
            -configuration Debug \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 240 \
            -destination "platform=iOS Simulator,id=$CAPTURE_DEVICE_ID" \
            -resultBundlePath "$RUNNER_TEMP/screenshots.xcresult" \
            CODE_SIGNING_ALLOWED=NO
      - name: Export test attachments
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/screenshots.xcresult"; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/screenshots.xcresult" --output-path "$RUNNER_TEMP/captured-screens"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/captured-screens
            ${{ runner.temp }}/screenshots.xcresult
          if-no-files-found: warn

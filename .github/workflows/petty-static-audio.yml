name: Generate Petty Static Audio

on:
  push:
    branches: [petty-static-batch]
    paths:
      - '.github/workflows/petty-static-audio.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: petty-static-batch
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate priority Petty MP3 batch
        run: node scripts/generate-petty-static-priority.mjs
      - name: Commit generated static audio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/petty-audio
          git diff --cached --quiet && exit 0
          git commit -m '[static-audio] Generate priority Petty MP3 batch'
          git push origin HEAD:petty-static-batch

name: Disable reaction ticks

on:
  push:
    branches:
      - fix/remove-nearmiss-beeps-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disable synthesized reaction wait ticks
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text()
          old = "function ticks(mode){untick();let b=mode==='timer'?250:mode==='stop'?190:150,i=0,ms=mode==='reaction'?360:190;st.tick=setInterval(()=>tone(b+Math.min(420,++i*11),.035,mode==='reaction'?'sine':'square',.018),ms)}"
          new = "function ticks(mode){untick();if(mode==='reaction')return;let b=mode==='timer'?250:190,i=0,ms=190;st.tick=setInterval(()=>tone(b+Math.min(420,++i*11),.035,'square',.018),ms)}"
          if old not in s:
              raise SystemExit('ticks block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit reaction tick removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Disable synthesized reaction wait ticks"
          git push

name: iOS App Store Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-app-store-release.yml'

jobs:
  release:
    runs-on: macos-15
    env:
      BUNDLE_ID: com.pettygamesstudios.ninetynineimpossible
      TEAM_ID: FHGP486J8U
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate Capacitor iOS project
        run: npm run ios:prepare

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Prepare App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_PRIVATE_KEY"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY" | base64 --decode > "$KEY_PATH"
          openssl pkey -in "$KEY_PATH" -noout
          echo "ASC_KEY_ID=$ASC_KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          SIGNING_DIR="$RUNNER_TEMP/signing"
          mkdir -p "$SIGNING_DIR"
          echo "SIGNING_DIR=$SIGNING_DIR" >> "$GITHUB_ENV"

      - name: Create temporary keychain
        run: |
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Configure fastlane signing lanes
        run: |
          mkdir -p fastlane
          cat > fastlane/Fastfile <<'RUBY'
          default_platform(:ios)

          platform :ios do
            private_lane :api_token do
              app_store_connect_api_key(
                key_id: ENV.fetch("ASC_KEY_ID"),
                issuer_id: ENV.fetch("ASC_ISSUER_ID"),
                key_filepath: ENV.fetch("ASC_KEY_PATH"),
                in_house: false
              )
            end

            lane :create_signing do
              token = api_token
              cert(
                api_key: token,
                team_id: ENV.fetch("TEAM_ID"),
                output_path: ENV.fetch("SIGNING_DIR"),
                keychain_path: ENV.fetch("KEYCHAIN_PATH"),
                keychain_password: "actions",
                generate_apple_certs: true
              )
              sigh(
                api_key: token,
                app_identifier: ENV.fetch("BUNDLE_ID"),
                team_id: ENV.fetch("TEAM_ID"),
                output_path: ENV.fetch("SIGNING_DIR"),
                filename: "99PercentImpossible.mobileprovision",
                force: true
              )
            end

            lane :upload_build do
              token = api_token
              pilot(
                api_key: token,
                ipa: ENV.fetch("IPA_PATH"),
                skip_waiting_for_build_processing: true
              )
            end
          end
          RUBY

      - name: Create signing assets in CI
        run: |
          fastlane ios create_signing
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          PROFILE_PATH="$SIGNING_DIR/99PercentImpossible.mobileprovision"
          test -f "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Set version and build number
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 1" ios/App/App/Info.plist || true

      - name: Archive signed app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/99PercentImpossible.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Automatic \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            archive

      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/99PercentImpossible.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: 99-percent-impossible-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: Upload to App Store Connect
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' -print -quit)
          test -n "$IPA"
          IPA_PATH="$IPA" fastlane ios upload_build

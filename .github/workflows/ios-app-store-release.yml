name: iOS App Store Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-app-store-release.yml'
      - 'release-assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'www/**'
      - 'assets/**'
      - 'src/**'

jobs:
  release:
    runs-on: macos-26
    env:
      BUNDLE_ID: com.pettygamesstudios.ninetynineimpossible
      TEAM_ID: FHGP486J8U
      STALE_DISTRIBUTION_CERT_IDS: 788LUV25T6,X69A9HLTP4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate Capacitor iOS project
        run: npm run ios:prepare

      - name: Install official app icon
        run: |
          ICON_SOURCE="release-assets/IMG_3826(1).png"
          ICON_SET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          CONTENTS="$ICON_SET/Contents.json"
          test -f "$ICON_SOURCE"
          test -f "$CONTENTS"
          TARGET_ICON=$(python3 - <<'PY'
          import json
          path = "ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json"
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)
          names = [item.get("filename") for item in data.get("images", []) if item.get("filename")]
          if not names:
              raise SystemExit("No icon filename found in AppIcon Contents.json")
          print(names[0])
          PY
          )
          /usr/bin/sips -s format png -z 1024 1024 "$ICON_SOURCE" --out "$ICON_SET/$TARGET_ICON"
          test -s "$ICON_SET/$TARGET_ICON"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleIconName AppIcon' ios/App/App/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c 'Add :CFBundleIconName string AppIcon' ios/App/App/Info.plist
          echo "Installed official icon as $TARGET_ICON and set CFBundleIconName=AppIcon"

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Prepare App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_PRIVATE_KEY"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY" | base64 --decode > "$KEY_PATH"
          openssl pkey -in "$KEY_PATH" -noout
          echo "ASC_KEY_ID=$ASC_KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          SIGNING_DIR="$RUNNER_TEMP/signing"
          mkdir -p "$SIGNING_DIR"
          echo "SIGNING_DIR=$SIGNING_DIR" >> "$GITHUB_ENV"
          echo "CREATED_CERT_ID_PATH=$RUNNER_TEMP/created-distribution-cert-id.txt" >> "$GITHUB_ENV"

      - name: Create temporary keychain
        run: |
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Configure fastlane signing lanes
        run: |
          mkdir -p fastlane
          cat > fastlane/Fastfile <<'RUBY'
          default_platform(:ios)
          platform :ios do
            private_lane :api_token do
              app_store_connect_api_key(
                key_id: ENV.fetch("ASC_KEY_ID"),
                issuer_id: ENV.fetch("ASC_ISSUER_ID"),
                key_filepath: ENV.fetch("ASC_KEY_PATH"),
                in_house: false
              )
            end
            private_lane :remove_known_stale_distribution_certs do
              api_token
              stale_ids = ENV.fetch("STALE_DISTRIBUTION_CERT_IDS", "").split(",").map(&:strip).reject(&:empty?)
              stale_ids.each do |cert_id|
                begin
                  cert = Spaceship::ConnectAPI::Certificate.get(certificate_id: cert_id)
                  if cert && ["DISTRIBUTION", "IOS_DISTRIBUTION"].include?(cert.certificate_type)
                    UI.message("Revoking known stale CI distribution certificate #{cert_id}")
                    cert.delete!
                  end
                rescue => e
                  UI.message("Stale certificate #{cert_id} is already absent or unavailable: #{e.message}")
                end
              end
            end
            lane :create_signing do
              token = api_token
              remove_known_stale_distribution_certs
              cert(
                api_key: token,
                team_id: ENV.fetch("TEAM_ID"),
                output_path: ENV.fetch("SIGNING_DIR"),
                keychain_path: ENV.fetch("KEYCHAIN_PATH"),
                keychain_password: "actions",
                generate_apple_certs: true
              )
              created_cert_id = lane_context[SharedValues::CERT_CERTIFICATE_ID]
              File.write(ENV.fetch("CREATED_CERT_ID_PATH"), created_cert_id.to_s) unless created_cert_id.to_s.empty?
              sigh(
                api_key: token,
                app_identifier: ENV.fetch("BUNDLE_ID"),
                team_id: ENV.fetch("TEAM_ID"),
                output_path: ENV.fetch("SIGNING_DIR"),
                filename: "99PercentImpossible.mobileprovision",
                force: true,
                cert_id: created_cert_id
              )
            end
            lane :upload_build do
              token = api_token
              upload_to_app_store(
                api_key: token,
                ipa: ENV.fetch("IPA_PATH"),
                skip_metadata: true,
                skip_screenshots: true,
                run_precheck_before_submit: false
              )
            end
          end
          RUBY

      - name: Create signing assets in CI
        run: |
          fastlane ios create_signing
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          PROFILE_PATH="$SIGNING_DIR/99PercentImpossible.mobileprovision"
          test -f "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Set version and unique build number
        run: |
          BUILD_NUMBER="${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_NUMBER}" ios/App/App/Info.plist || true
          echo "Using iOS build number ${BUILD_NUMBER}"

      - name: Configure App target signing
        run: |
          ruby <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          target = project.targets.find { |t| t.name == 'App' }
          raise 'App target not found' unless target
          target.build_configurations.each do |config|
            next unless config.name == 'Release'
            config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
            config.build_settings['DEVELOPMENT_TEAM'] = ENV.fetch('TEAM_ID')
            config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = ENV.fetch('BUNDLE_ID')
            config.build_settings['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] = 'Apple Distribution'
            config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ENV.fetch('PROFILE_NAME')
          end
          project.save
          RUBY

      - name: Archive signed app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/99PercentImpossible.xcarchive" \
            archive

      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/99PercentImpossible.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: 99-percent-impossible-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: Upload to App Store Connect
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' -print -quit)
          test -n "$IPA"
          IPA_PATH="$IPA" fastlane ios upload_build

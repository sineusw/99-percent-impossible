name: Remove near-miss beeps

on:
  push:
    branches:
      - fix/remove-nearmiss-beeps-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove synthesized near-miss suspense tone
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text()
          old = "let c=audio();if(c){let o=c.createOscillator(),g=c.createGain(),n=c.currentTime;o.type='sine';o.frequency.setValueAtTime(135,n);o.frequency.exponentialRampToValueAtTime(230,n+.36);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.055,n+.03);g.gain.exponentialRampToValueAtTime(.0001,n+.39);o.connect(g).connect(c.destination);o.start(n);o.stop(n+.4)}"
          if old not in s:
              raise SystemExit('nearReveal tone block not found')
          p.write_text(s.replace(old, '', 1))
          PY
      - name: Commit beep removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Remove near-miss suspense beeps"
          git push

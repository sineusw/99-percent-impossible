name: Generate Daisy and Mick static audio
on:
  workflow_dispatch:
  push:
    branches: [voices/daisy-mick-static]
    paths:
      - 'cast-phrases-v1.js'
      - 'scripts/generate-cast-audio.mjs'
      - '.github/workflows/generate-cast-audio.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: voices/daisy-mick-static
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify ElevenLabs key
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: test -n "$ELEVENLABS_API_KEY" || (echo 'ELEVENLABS_API_KEY repository secret is missing' && exit 1)
      - name: Generate all cast MP3 files
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node scripts/generate-cast-audio.mjs
      - name: Commit generated audio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/daisy-audio assets/mick-audio
          if git diff --cached --quiet; then echo 'No new audio to commit'; exit 0; fi
          git commit -m 'Generate Daisy and Mick static voice assets'
          git push

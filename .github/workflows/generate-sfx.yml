name: Generate gameplay SFX
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-sfx.mjs'
      - '.github/workflows/generate-sfx.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify ElevenLabs key
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: test -n "$ELEVENLABS_API_KEY" || (echo 'ELEVENLABS_API_KEY repository secret is missing' && exit 1)
      - name: Generate gameplay SFX MP3 files
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node scripts/generate-sfx.mjs
      - name: Commit generated SFX
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/sfx
          if git diff --cached --quiet; then echo 'No new SFX to commit'; exit 0; fi
          git commit -m 'Generate gameplay SFX assets'
          git push

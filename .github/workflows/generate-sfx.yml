name: Generate gameplay SFX
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-sfx.py'
      - '.github/workflows/generate-sfx.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Generate gameplay SFX MP3 files
        run: python3 scripts/generate-sfx.py
      - name: Commit generated SFX
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/sfx
          if git diff --cached --quiet; then echo 'No new SFX to commit'; exit 0; fi
          git commit -m 'Generate gameplay SFX assets'
          git push

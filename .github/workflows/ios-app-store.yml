name: iOS App Store Build

on:
  workflow_dispatch:
    inputs:
      upload_to_app_store:
        description: 'Build signed IPA and upload to App Store Connect'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/stage-web.sh'
      - '.github/workflows/ios-app-store.yml'
      - '.ios-build-trigger'

jobs:
  validate-ios-build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate Capacitor iOS project
        run: npm run ios:prepare

      - name: Set version and build number
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 1" ios/App/App/Info.plist || true

      - name: Validate iOS compilation
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload generated iOS project
        uses: actions/upload-artifact@v4
        with:
          name: ios-generated-project
          path: ios
          if-no-files-found: error

  app-store-upload:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_app_store }}
    runs-on: macos-15
    env:
      BUNDLE_ID: com.pettygamesstudios.ninetynineimpossible
      TEAM_ID: FHGP486J8U
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate Capacitor iOS project
        run: npm run ios:prepare

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Prepare App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_PRIVATE_KEY"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY" > "$KEY_PATH"
          python3 - <<'PY'
          import json, os, pathlib
          payload = {
              "key_id": os.environ["ASC_KEY_ID"],
              "issuer_id": os.environ["ASC_ISSUER_ID"],
              "key": os.environ["ASC_PRIVATE_KEY"],
              "in_house": False,
          }
          pathlib.Path(os.environ["RUNNER_TEMP"], "api_key.json").write_text(json.dumps(payload))
          PY

      - name: Create temporary keychain
        run: |
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Create Apple Distribution certificate in CI
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          fastlane cert \
            --api_key_path "$RUNNER_TEMP/api_key.json" \
            --team_id "$TEAM_ID" \
            --output_path "$RUNNER_TEMP/signing" \
            --keychain_path "$KEYCHAIN_PATH" \
            --keychain_password actions \
            --generate_apple_certs true
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Create App Store provisioning profile in CI
        run: |
          fastlane sigh \
            --api_key_path "$RUNNER_TEMP/api_key.json" \
            --app_identifier "$BUNDLE_ID" \
            --team_id "$TEAM_ID" \
            --output_path "$RUNNER_TEMP/signing" \
            --filename "99PercentImpossible.mobileprovision" \
            --force
          PROFILE_PATH="$RUNNER_TEMP/signing/99PercentImpossible.mobileprovision"
          test -f "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Set version and build number
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 1" ios/App/App/Info.plist || true

      - name: Archive signed app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/99PercentImpossible.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            archive

      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/99PercentImpossible.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          ls -la "$RUNNER_TEMP/export"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: 99-percent-impossible-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: Upload to App Store Connect
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' -print -quit)
          test -n "$IPA"
          fastlane pilot upload \
            --ipa "$IPA" \
            --api_key_path "$RUNNER_TEMP/api_key.json" \
            --skip_waiting_for_build_processing true

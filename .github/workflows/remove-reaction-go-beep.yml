name: Remove reaction GO beep

on:
  push:
    branches:
      - fix/remove-nearmiss-beeps-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove reaction GO tone
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text()
          old = "untick();tone(920,.08,'square',.05);st.ready=1"
          new = "untick();st.ready=1"
          if old not in s:
              raise SystemExit('reaction GO tone not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit reaction beep removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Remove reaction GO beep"
          git push

name: Build Android Billing AAB

on:
  workflow_dispatch:
  push:
    branches:
      - monetization/remove-ads-native

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor
        run: npm install

      - name: Prepare native web assets
        run: npm run native:prepare

      - name: Generate Android project
        run: npx cap add android

      - name: Add Google Play Billing and API 36 config
        run: npm run native:configure:android

      - name: Install Android API 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"

      - name: Verify Android release config
        run: |
          grep -E "compileSdkVersion\s*=\s*36" android/variables.gradle
          grep -E "targetSdkVersion\s*=\s*36" android/variables.gradle
          grep -E "versionCode\s+7" android/app/build.gradle
          grep -E "versionName\s+\"1.0.6\"" android/app/build.gradle
          grep -F "registerPlugin(N99BillingPlugin.class);" android/app/src/main/java/com/pettygamesstudios/ninetynineimpossible/MainActivity.java
          grep -F "setMediaPlaybackRequiresUserGesture(false);" android/app/src/main/java/com/pettygamesstudios/ninetynineimpossible/MainActivity.java
          grep -F -- "-keep classes com.pettygamesstudios.ninetynineimpossible.** { *; }" android/app/proguard-rules.pro
          test -s android/app/src/main/assets/public/assets/sfx/fail.mp3
          test -s android/app/src/main/assets/public/assets/sfx/win.mp3
          test -s android/app/src/main/assets/public/assets/sfx/perfect.mp3
          python - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/java/com/pettygamesstudios/ninetynineimpossible/MainActivity.java')
          s=p.read_text()
          reg=s.index('registerPlugin(N99BillingPlugin.class);')
          sup=s.index('super.onCreate(savedInstanceState);')
          audio=s.index('setMediaPlaybackRequiresUserGesture(false);')
          assert reg < sup < audio, 'Expected plugin registration before super.onCreate and WebView audio config after it'
          print('Verified billing registration order and Android WebView audio playback configuration')
          PY

      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          echo "$KEYSTORE_B64" | base64 --decode > android/app/n99-upload-key.jks

      - name: Build signed release AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: n99-upload-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: 99-percent-impossible-android-aab-api36-v7
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

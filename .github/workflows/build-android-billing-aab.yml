name: Build Android Billing AAB

on:
  workflow_dispatch:
  push:
    branches:
      - release/android-closed-testing-v15

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Capacitor and native Share
        run: npm install
      - name: Prepare native web assets
        run: npm run native:prepare
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor Android plugins
        run: npx cap sync android
      - name: Configure native billing and API 36
        run: npm run native:configure:android
      - name: Install Android API 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
      - name: Verify Android v15 closed-testing release config
        run: |
          grep -E "compileSdkVersion\s*=\s*36" android/variables.gradle
          grep -E "targetSdkVersion\s*=\s*36" android/variables.gradle
          grep -E "versionCode\s+15" android/app/build.gradle
          grep -E "versionName\s+\"1.0.14\"" android/app/build.gradle
          MAIN=android/app/src/main/java/com/pettygamesstudios/ninetynineimpossible/MainActivity.java
          SFXJAVA=android/app/src/main/java/com/pettygamesstudios/ninetynineimpossible/N99SfxPlugin.java
          SFXJS=android/app/src/main/assets/public/static-sfx-v1.js
          V027=android/app/src/main/assets/public/v027.js
          VOICE=android/app/src/main/assets/public/voice-controls-v062.js
          grep -F "registerPlugin(N99BillingPlugin.class);" "$MAIN"
          grep -F "registerPlugin(N99SfxPlugin.class);" "$MAIN"
          grep -F "setMediaPlaybackRequiresUserGesture(false);" "$MAIN"
          grep -F '@CapacitorPlugin(name = "N99Sfx")' "$SFXJAVA"
          grep -F "POOL_SIZE=3" "$SFXJS"
          grep -F "window.N99DiscreteSFX={playEarlyFail:()=>play('fail')}" "$SFXJS"
          grep -F "baseShow(score,roast,meta,share,t,isPB,fail,delta);" "$V027"
          grep -F "if(fail&&!visualFail)" "$V027"
          grep -F "window.unlockPettyAudio?.()" "$VOICE"
          ! grep -F "SFX v14" "$SFXJS"
          ! grep -F "js:plugin-visibility" "$SFXJS"
          grep -F -- "-keep classes com.pettygamesstudios.ninetynineimpossible.** { *; }" android/app/proguard-rules.pro
          test -s android/app/src/main/res/raw/n99_fail.mp3
          test -s android/app/src/main/res/raw/n99_win.mp3
          test -s android/app/src/main/res/raw/n99_perfect.mp3
          test -d node_modules/@capacitor/share
          grep -R "capacitor-share" android/capacitor.settings.gradle android/app/capacitor.build.gradle
          test -s android/app/src/main/assets/public/native-speech-shim.js
          test -s android/app/src/main/assets/public/native-api-bridge.js
          test -s android/app/src/main/assets/public/share-result-v1.js
          grep -F "Capacitor?.Plugins?.Share" android/app/src/main/assets/public/share-result-v1.js
          ! grep -F "HTMLMediaElement" android/app/src/main/assets/public/native-api-bridge.js
          test -s android/app/src/main/assets/public/assets/sfx/fail.mp3
          test -s android/app/src/main/assets/public/assets/sfx/win.mp3
          test -s android/app/src/main/assets/public/assets/sfx/perfect.mp3
          test -d android/app/src/main/assets/public/assets/daisy-audio
          test -d android/app/src/main/assets/public/assets/mick-audio
          python - <<'PY'
          from pathlib import Path
          s=Path('android/app/src/main/java/com/pettygamesstudios/ninetynineimpossible/MainActivity.java').read_text()
          billing=s.index('registerPlugin(N99BillingPlugin.class);')
          sfx=s.index('registerPlugin(N99SfxPlugin.class);')
          sup=s.index('super.onCreate(savedInstanceState);')
          media=s.index('setMediaPlaybackRequiresUserGesture(false);')
          assert billing < sup and sfx < sup < media
          html=Path('android/app/src/main/assets/public/index.html').read_text()
          assert html.index('native-speech-shim.js') < html.index('petty.js') < html.index('petty-static-audio.js')
          print('Verified Android v15 closed-testing release candidate')
          PY
      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          echo "$KEYSTORE_B64" | base64 --decode > android/app/n99-upload-key.jks
      - name: Build signed release AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: n99-upload-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: 99-percent-impossible-android-aab-v15-closed-testing
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
